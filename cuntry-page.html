<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countries</title>
  <!-- META-TEG -->
  <meta name="author" content="Farrux Djalilov">
  <meta name="description" content="Information about this project country">
  <meta name="keywords" content="country">
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="./asset/css/normalize.css">
  <link rel="stylesheet" href="./asset/css/styles.css">
</head>
<body>

  <!-- HEADER -->
   <header class="index-header">
    <div class="header-container flex-between container">
      <a class="site-header-logo" href="index.html">Where in the world?</a>
      <button class="site-header-toggler">
        <span class="site-header-toggler-inner">
          <svg class="site-header-toggler-inner-img" xmlns="http://www.w3.org/2000/svg" width="20" height="20"><path fill="#fff" fill-rule="evenodd" stroke="currentColor" stroke-width="1.25" d="M12.553 11.815c-3.884 0-7.034-2.887-7.034-6.447 0-1.343.448-2.586 1.212-3.618C3.691 2.695 1.5 5.331 1.5 8.438c0 3.9 3.45 7.062 7.704 7.062 3.389 0 6.266-2.007 7.296-4.796a7.458 7.458 0 0 1-3.947 1.111Z" clip-rule="evenodd"/></svg>
          <span class="site-header-toggler-inner-text">Dark Mode</span>
        </span>
      </button>
    </div>
   </header>

   <!-- MAIN -->
    <main class="main-content main-content-inner">
        <div class="container">
          <a class="contry-page-back-link" href="index.html">
            <svg class="contry-page-back-icon" width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <g id="call-made">
              <path id="Shape" fill-rule="evenodd" clip-rule="evenodd" d="M6.46447 4.10744L7.64298 5.28596L3.75389 9.17504L18.6031 9.17504L18.6031 10.825L3.75389 10.825L7.64298 14.714L6.46447 15.8926L0.57191 10L6.46447 4.10744Z" fill="currentColor"/>
              </g>
              </svg>
            <span class="contry-page-back-text">Back</span>
          </a>

          <!-- COUNTRY-FLAG-INFO -->

          <section class="contry-page-info-flag">
            <img class="contry-page-flag-image" src="./asset/image/flag-belgium.jpg" alt="Belgium flag" width="560" height="400" srcset="./asset/image/flag-belgium.jpg 1x, ./asset/image/flag-belgium@2x.jpg 2x">

            <!-- COUNTRY-PAGE INFO -->

            <div class="country-page-info">
              <h1 class="country-page-title">Belgium</h1>
              <div class="country-page-dls-wrapper">
                <dl class="contry-page-details">
                  <div class="country-page-details-item">
                    <dt class="country-page-details-title">Native Name:</dt>
                    <dd class="contry-page-details-value">België</dd>
                  </div>
                  <div class="country-page-details-item">
                    <dt class="country-page-details-title">Population:</dt>
                    <dd class="contry-page-details-value">11,319,511</dd>
                  </div>
                  <div class="country-page-details-item">
                    <dt class="country-page-details-title">Region:</dt>
                    <dd class="contry-page-details-value">Europe</dd>
                  </div>
                  <div class="country-page-details-item">
                    <dt class="country-page-details-title">Sub Region:</dt>
                    <dd class="contry-page-details-value">Western Europe</dd>
                  </div>
                  <div class="country-page-details-item">
                    <dt class="country-page-details-title">Capital:</dt>
                    <dd class="contry-page-details-value">Brussels</dd>
                  </div>
                </dl>
                <dl class="contry-page-details">
                  <div class="country-page-details-item">
                    <dt class="country-page-details-title">Top Level Domain:</dt>
                    <dd class="contry-page-details-value">.be</dd>
                  </div>
                  <div class="country-page-details-item">
                    <dt class="country-page-details-title">Currencies:</dt>
                    <dd class="contry-page-details-value">Euro</dd>
                  </div>
                  <div class="country-page-details-item">
                    <dt class="country-page-details-title">Languages:</dt>
                    <dd class="contry-page-details-value">Dutch, French, German</dd>
                  </div>
                </dl>
              </div>
              <div class="country-page-border-countries">
                <h2 class="country-page-border-countries-heading">Border Countries:</h2>
                <div class="country-page-border-countries-list">
                  <a class="country-page-border-countries-link" href="country.html">France</a>
                  <a class="country-page-border-countries-link" href="country.html">Germany</a>
                  <a class="country-page-border-countries-link" href="country.html">Netherlands</a>
                </div>
              </div>
            </div>
          </section>
        </div>
    </main>
  <!-- JS FILE -->
   <script src="./asset/js/main.js"></script>
</body>
</html>
